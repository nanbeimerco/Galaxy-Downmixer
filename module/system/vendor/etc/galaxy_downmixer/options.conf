# Galaxy Downmixer options. Read once when the audio HAL first creates the
# effect; restart the HAL to apply changes:
#   su -c 'killall android.hardware.audio.service'

# 0 = pass the input through untouched (Android's own downmix), for A/B tests
enabled=1

# Swap left/right programme content (per-ear EQ stays on the physical side)
swap=0

# Channels to mute before the downmix, e.g. mute=TBL,TBR
mute=

# Gain after the downmix matrix, in dB (headroom)
master_db=0

# LFE 4th-order Butterworth low-pass at 125 Hz
lfe_lpf=1

# Equalizer APO file (common section + "Channel: L" / "Channel: R" sections)
eq_file=/vendor/etc/galaxy_downmixer/eq.txt

# Seconds between meter lines in logcat (tag GalaxyDownmixer); 0 = off
log_interval_s=5
